<body>
    <button onclick="debugTerminalInput()">Test Terminal Input</button>
    <div id="terminal"></div>
  
    <script>
      // Terminal setup
      const term = new Terminal({
        cursorBlink: true,
        cursorStyle: 'block',
        scrollback: 1000,
      });
  
      term.open(document.getElementById('terminal'));
      term.focus();
      term.write('Terminal Ready\r\n');
  
      let userInput = '';
      let waitingForInput = false;
      let inputCallback = null;
  
      term.onData(e => {
        if (!waitingForInput) return;
  
        if (e === '\r') {
          term.write('\r\n');
          waitingForInput = false;
          if (inputCallback) inputCallback(userInput);
          userInput = '';
        } else if (e === '\u007f') {
          if (userInput.length > 0) {
            userInput = userInput.slice(0, -1);
            term.write('\b \b');
          }
        } else {
          userInput += e;
          term.write(e);
        }
      });
  
      function waitForInput(prompt = '') {
        return new Promise(resolve => {
          term.write(prompt);
          term.focus();
          waitingForInput = true;
          userInput = '';
          inputCallback = resolve;
        });
      }
  
      async function debugTerminalInput() {
        const input = await waitForInput('Input for x: ');
        term.write(`You typed: ${input}\r\n`);
        console.log("✅ Captured input:", input);
      }
  
      // 🔥 Expose to window explicitly
      window.debugTerminalInput = debugTerminalInput;
    </script>
  </body>
